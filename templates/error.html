<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} | FUNAAB ONE</title>
    <style>
        :root { --green:#087443; --green-dark:#075c36; --bg:#f3f7f4; --card:#fff; --text:#17251d; --muted:#6b786f; --border:#dce6de; }
        @media (prefers-color-scheme: dark) {
            :root { --bg:#101a14; --card:#19271e; --text:#edf6ef; --muted:#a9b9ad; --border:#34483a; }
        }
        * { box-sizing:border-box; margin:0; padding:0; }
        body { min-height:100vh; display:grid; place-items:center; padding:20px; background:var(--bg); color:var(--text);
               font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; }
        .card { max-width:420px; width:100%; background:var(--card); border:1px solid var(--border); border-radius:18px; padding:32px 26px; text-align:center; }
        .code { font-size:52px; font-weight:800; color:var(--green); line-height:1; }
        h1 { font-size:22px; margin:14px 0 8px; }
        p { color:var(--muted); line-height:1.5; margin-bottom:22px; }
        a { display:inline-block; background:var(--green); color:#fff; text-decoration:none; font-weight:700; padding:12px 22px; border-radius:12px; }
        a:hover { background:var(--green-dark); }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='funaab-glass.css') }}">
</head>
<body>
    <div class="card">
        <div class="code">{{ code }}</div>
        <h1>{{ title }}</h1>
        <p>{{ message }}</p>
        <a href="{{ url_for('home') }}">Back to FUNAAB ONE</a>
    </div>
</body>
</html>
